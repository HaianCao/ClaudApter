[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claudapter"
version = "0.2.0"
description = "A local provider setup studio and launcher for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The local gateway is part of every install (direct mode stays available).
dependencies = ["protoverta==0.3.0"]
authors = [{ name = "HaianCao", email = "caohaian2005@gmail.com" }]
keywords = ["claude-code", "claude", "anthropic", "llm", "launcher", "openrouter", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/HaianCao/ClaudApter"
Documentation = "https://github.com/HaianCao/ClaudApter#readme"
Repository = "https://github.com/HaianCao/ClaudApter"
Issues = "https://github.com/HaianCao/ClaudApter/issues"
Changelog = "https://github.com/HaianCao/ClaudApter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
# Kept so older install commands that request the extra keep working.
gateway = []

[project.scripts]
claude-ca = "claudapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudapter"]

[tool.hatch.build.targets.wheel.force-include]
"src/claudapter/web_template.html" = "claudapter/web_template.html"
"assets/ClaudApter_black.png" = "claudapter/assets/ClaudApter_black.png"
"assets/ClaudApter_white.png" = "claudapter/assets/ClaudApter_white.png"
"assets/ClaudApter_black_icon.png" = "claudapter/assets/ClaudApter_black_icon.png"
"assets/ClaudApter_white_icon.png" = "claudapter/assets/ClaudApter_white_icon.png"

[tool.ruff]
# Formatter width; long literals that cannot wrap are left as written.
line-length = 160

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
