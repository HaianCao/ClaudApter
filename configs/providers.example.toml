# ClaudApter user config example. Do not put API keys in this file.
schema_version = 1

[defaults]
provider = "example"
model = "claude-model-id"
effort = "default"

[[providers]]
id = "example"
display_name = "Example Gateway"
base_url = "https://gateway.example.com/v1"
auth_mode = "bearer" # bearer or api_key
default_model = "claude-model-id"
protocol = "messages" # messages, chat or responses; non-Messages requires gateway
execution_mode = "direct" # direct or gateway
upstream_reasoning = "auto" # Automatic route compatibility; native Messages unchanged.
# Optional capability checks require execution_mode = "gateway".
# capabilities_file = "capabilities.json" # relative to this config file
# require_verified_capabilities = true
# Optional runtime overrides also require gateway mode; omitted values use defaults.
# gateway_limits = { total_timeout = 600, progress_timeout = 120, max_stream_bytes = 33554432 }

# A translated provider uses the exact API prefix, including its version.
# [[providers]]
# id = "chat_provider"
# display_name = "Chat Provider"
# base_url = "https://provider.example/v1"
# protocol = "chat"
# execution_mode = "gateway"
# auth_mode = "bearer"
