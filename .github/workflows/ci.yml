name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the pinned Protoverta wheel
        run: python -m pip install https://github.com/HaianCao/Protoverta/releases/download/v0.3.0rc1/protoverta-0.3.0rc1-py3-none-any.whl
      - name: Install and test
        run: |
          python -m pip install -e ".[test]" build ruff==0.17.2
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          python -m pytest -q --junitxml=test-results.xml
          if ($LASTEXITCODE) { throw 'Tests failed' }
          python -m ruff check src tests scripts
          if ($LASTEXITCODE) { throw 'Lint failed' }
          python -m ruff format --check src tests scripts
          if ($LASTEXITCODE) { throw 'Formatting check failed' }
          python -m build --wheel
          if ($LASTEXITCODE) { throw 'Build failed' }
          python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(wheel).namelist()); expected={'claudapter/web_template.html','claudapter/assets/ClaudApter_black.png','claudapter/assets/ClaudApter_white.png','claudapter/assets/ClaudApter_black_icon.png','claudapter/assets/ClaudApter_white_icon.png'}; missing=expected-names; assert not missing, f'Missing package files: {missing}'"
      - name: Gateway tests must not skip or use an obsolete runtime
        run: |
          python -c "from protoverta.server import GatewayConfig; import dataclasses; assert {'retry_attempts','shared_admission_db','client_tool_search','provider_profiles'} <= {f.name for f in dataclasses.fields(GatewayConfig)}"
          if ($LASTEXITCODE) { throw 'Incompatible gateway runtime' }
          python scripts/check_test_report.py test-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: claude-tests-${{ matrix.python-version }}
          path: test-results.xml
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/install-environment.ps1', 'scripts/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file has PowerShell parse errors: $errors" }
          }
      - name: Check PowerShell 7 syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/install-environment.ps1', 'scripts/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file has PowerShell parse errors: $errors" }
          }
      - name: Smoke-test Windows install, update and uninstall
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP 'protoverta-wheel'
          python -m pip download --no-deps --dest $wheelDir https://github.com/HaianCao/Protoverta/releases/download/v0.3.0rc1/protoverta-0.3.0rc1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Protoverta wheel' }
          $wheel = (Get-ChildItem -LiteralPath $wheelDir -Filter 'protoverta-*.whl' | Select-Object -First 1).FullName
          & .\scripts\install.ps1 -SkipClaudeInstall -NonInteractive -ProtovertaWheel $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Initial installation failed' }
          . .\scripts\install-environment.ps1
          $root = Join-Path $env:LOCALAPPDATA 'Programs\claudapter'
          $launcher = Join-Path $root 'bin\claude-ca.exe'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'claude-ca launcher was not installed' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw 'claude-ca --help failed' }
          $python = Get-AdapterInstalledPython $root
          & $python -c "import importlib.metadata, protoverta.server; assert importlib.metadata.version('protoverta') == '0.3.0rc1'"
          if ($LASTEXITCODE -ne 0) { throw 'The pinned gateway component was not installed' }
          # Older install commands pass -WithGateway; it is accepted and changes nothing.
          & .\scripts\install.ps1 -SkipClaudeInstall -NonInteractive -WithGateway -ProtovertaWheel $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Update with the legacy -WithGateway flag failed' }
          $python = Get-AdapterInstalledPython $root
          & $python -c "import protoverta.server"
          if ($LASTEXITCODE -ne 0) { throw 'Updating dropped the gateway component' }
          & .\scripts\uninstall.ps1 -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
          if (Test-Path -LiteralPath $launcher) { throw 'claude-ca launcher was not removed' }
